<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
<h1>Send Us a Message</h1>
<Form>
    
    <input type="text" id="name" name="name" required placeholder="Kartik"> <br><br>

   
   <input type="email" id="Email" name="Email" required placeholder="example@email.com"><br><br>
    
   <input type="tel" id="Phone" name="Phone" placeholder="+92 3456789000"> <br> <br>
   <textarea name="message " placeholder="Enter your message here..." id="message"></textarea> <br> <br>
<button type="submit" class="submit-btn">Submit Form ✈</button>

   </Form> 
</div>
</body>
</html>
